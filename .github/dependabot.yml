version: 2
updates:
  # server/requirements.in (direct pins) and server/requirements.txt (pip-compile, with hashes)
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  # The base image digest in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
