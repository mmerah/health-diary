name: Test and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements-dev.txt
      - name: Lint
        run: ruff check server
      - name: Test
        run: python -m pytest -q server/tests
      - name: Check dependencies for known vulnerabilities
        run: |
          pip install pip-audit==2.10.1
          pip-audit --require-hashes --disable-pip -r server/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: for f in $(find web -name '*.js' -not -path '*/fonts/*'); do node --check "$f"; done
      - name: Test JavaScript
        run: if [ -d web/tests ]; then node --test "web/tests/*.test.js"; fi

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
