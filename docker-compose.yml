services:
  health-diary:
    image: ghcr.io/mmerah/health-diary:latest
    # To build from source instead, replace the line above with:  build: .
    container_name: health-diary
    restart: unless-stopped
    env_file: .env
    volumes:
      # The database (diary.db) and secret.key. Back up this folder.
      - ./data:/data
    # Hardening. The entrypoint starts as root only to fix the owner of ./data,
    # then runs the app as PUID:PGID with no extra rights.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN         # give ./data to PUID:PGID
      - FOWNER        # chmod files in ./data that belong to PUID
      - DAC_OVERRIDE  # read ./data when it is 700 and belongs to PUID
      - SETUID        # switch to PUID
      - SETGID        # switch to PGID
    # No ports: Docktail sends tailnet traffic straight to the container.
    # Without Docktail, publish a port instead, for example:  ports: ["127.0.0.1:8000:8000"]
    labels:
      - docktail.service.enable=true
      - docktail.service.name=health-diary
      - docktail.service.port=8000
      - docktail.service.service-port=443
      # Optional, if Homepage reads Docker labels. Replace tailXXXX with your tailnet name.
      # - homepage.group=Personal
      # - homepage.name=Health Diary
      # - homepage.icon=mdi-heart-pulse
      # - homepage.href=https://health-diary.tailXXXX.ts.net
